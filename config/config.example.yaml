# Copy to config/config.yaml and edit. Secrets live in .env, never here.

meta:
  # Meta is DISABLED by default so a Zalo-only first run works out of the box.
  # To enable: set page_id, put META_PAGE_TOKEN in .env, then set
  #   platforms: ["messenger"]        (add "instagram" once granted)
  platforms: []

  page_id: ""                    # Facebook Page ID
  instagram_id: ""               # IG professional account ID; leave blank if unused
  api_version: "v21.0"
  page_size: 50
  message_page_size: 100
  max_conversations: null        # cap for testing, e.g. 5

zalo:
  inbox_dir: "data/inbox/zalo"
  timezone: "Asia/Ho_Chi_Minh"   # Zalo transcripts carry naive local time

  # Names that are US, not the customer. Anything else is treated as inbound.
  # Get these exactly right or every message will be labelled inbound.
  own_names:
    - "Lavabo Store"
    - "Your Name Here"

  # Optional: regex tried BEFORE the built-in patterns. Needs named groups
  # (?P<name>...) (?P<ts>...) (?P<text>...). Tune against a real export --
  # see docs/03-zalo-runbook.md.
  line_patterns: []

extract:
  # --- Gemini free tier (no card needed; key from https://aistudio.google.com/apikey) ---
  provider: "gemini"
  model: "gemini-3.1-flash"      # verify with `lavabo models` -- model names change
                                 # often, and that command lists what YOUR key accepts
  concurrency: 1                 # free tier is a few requests/minute; keep this at 1
                                 # (429s are retried with backoff, but going slow is faster)

  # --- Anthropic (paid) ---
  # provider: "anthropic"
  # model: "claude-sonnet-5"     # or claude-opus-5 for the hardest extractions
  # concurrency: 4

  max_tokens: 4096
  temperature: 0.0               # deterministic: this is extraction, not writing
  max_transcript_chars: 120000

# Read by the terminal app and the web page only — the pipeline ignores this block.
app:
  # Default Người chốt đơn. Both front ends ask per capture and remember the answer;
  # this is only the starting suggestion before anyone has been asked.
  closer: ""

  # The shop's own workbook, for "Thêm vào file quản lý" / `lavabo append`. Left empty,
  # that button is disabled and only a separate month file is produced. It is backed up
  # before every write.
  #
  #   macOS:   workbook: "/Users/you/Documents/QUẢN LÝ ĐƠN SENKAHOMES.xlsx"
  #   Windows: workbook: "C:/Users/You/Documents/QUẢN LÝ ĐƠN SENKAHOMES.xlsx"
  #
  # On Windows use forward slashes as above, or 'single quotes' around a backslash
  # path. In "double quotes" YAML reads \ as an escape and the file stops loading.
  # Easiest is to skip this: press [2] in the app and paste the path once.
  workbook: ""

db_path: "data/staging.db"
output_dir: "data/out"
schema_path: "config/schema.yaml"
